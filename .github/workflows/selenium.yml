
name: Selenium Java Automation

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

  workflow_dispatch:

jobs:
  selenium-test:
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Check Java Version
        run: java -version

      - name: Run Selenium Tests
        run: mvn clean test
